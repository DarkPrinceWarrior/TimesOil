# Linux host profile for the existing loopback CONNECT proxy on A100.
services:
  api:
    network_mode: host
    ports: !reset []
    command: ["uvicorn", "timesoil.aios.api:app", "--host", "127.0.0.1", "--port", "${AIOS_PORT:-18082}"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:${AIOS_PORT:-18082}/health', timeout=3).read()"]
