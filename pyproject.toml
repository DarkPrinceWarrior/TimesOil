[project]
name = "scorp-timesoil-track2"
version = "0.2.0"
description = "TimesOil Track 2: Model Z surrogate, AIOS, OPM replay and CHDD"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.116",
    "httpx>=0.28",
    "lightgbm>=4.6.0",
    "numpy>=2.1",
    "openpyxl>=3.1",
    "pandas>=2.2",
    "pyarrow>=17",
    "pydantic>=2.11",
    "uvicorn>=0.35",
]

[project.scripts]
timesoil-aios = "timesoil.aios.cli:main"

[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/timesoil"]

[dependency-groups]
dev = [
    "hatchling==1.32.0",
    "pytest>=8.4",
]
