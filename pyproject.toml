[project]
name = "scorp-timesoil-track2"
version = "0.2.0"
description = "TimesOil Track 2: TimesFM forecast, AIOS agents, OPM verification and official NPV"
requires-python = ">=3.13,<3.14"
dependencies = [
    "cma>=4.4.4",
    "fastapi>=0.116",
    "httpx>=0.28",
    "numpy>=2.1",
    "openpyxl>=3.1",
    "pandas>=2.2",
    "pydantic>=2.11",
    "scipy>=1.18.1",
    "uvicorn>=0.35",
]

[project.scripts]
timesoil-aios = "timesoil.aios.cli:main"

[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/timesoil"]

[tool.pytest.ini_options]
pythonpath = ["src", "scripts"]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "hatchling==1.32.0",
    "pytest>=8.4",
]
